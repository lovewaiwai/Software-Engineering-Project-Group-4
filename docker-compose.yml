services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: swapcampus-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMD=/opt/mssql-tools18/bin/sqlcmd; [ -x $$SQLCMD ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd; $$SQLCMD -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: swapcampus-db-init
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: SwapCampus
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
      DB_ROOT: /workspace/db
    volumes:
      - ./db:/workspace/db:ro
      - ./infra/sqlserver/apply-all-sql.sh:/workspace/apply-all-sql.sh:ro
    entrypoint: ["/bin/bash", "/workspace/apply-all-sql.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: swapcampus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  backend:
    image: swapcampus-backend:dev
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=SwapCampus;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: swapcampus
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  frontend:
    image: swapcampus-frontend:dev
    profiles: ["app"]
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  sqlserver-data:
  minio-data:
